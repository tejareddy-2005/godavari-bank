<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Godavari Bank (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<main class="container-fluid p-0">
<div class="row g-0 min-vh-100">
  <section class="col-lg-5 gb-side d-flex flex-column justify-content-between p-4 p-lg-5">
    <a class="navbar-brand text-white" href="index.html"><span class="gb-mark">G</span>Godavari Bank</a>
    <div class="my-5">
      <h1 class="display-6 text-white">Your accounts, in one calm place.</h1>
      <p class="lead text-white-50 mt-3">Check balances, send money and review every transaction without the clutter.</p>
    </div>
    <p class="small text-white-50 mb-0">Demo site for a college project. Accounts and money are simulated and saved only in this browser.</p>
  </section>
  <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
    <form id="loginForm" class="gb-card p-4 p-md-5 w-100" style="max-width:26rem" novalidate>
      <h2 class="h3 mb-1">Log in</h2>
      <p class="text-muted mb-4">New here? <a href="signup.html">Create an account</a>.</p>
      <div class="mb-3">
        <label for="user" class="form-label">Username</label>
        <input type="text" class="form-control" id="user" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="pass" class="form-label">Password</label>
        <input type="password" class="form-control" id="pass" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
      <button type="submit" class="btn btn-gb w-100 mt-2">Log in</button>
    </form>
  </section>
</div>
</main>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
