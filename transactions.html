<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions | Godavari Bank (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="transactions">
<nav class="navbar navbar-expand-lg gb-nav">
  <div class="container">
    <a class="navbar-brand" href="dashboard.html"><span class="gb-mark">G</span>Godavari Bank</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item"><a class="nav-link " href="dashboard.html">Accounts</a></li>
        <li class="nav-item"><a class="nav-link " href="transfer.html">Transfer money</a></li>
        <li class="nav-item"><a class="nav-link active" href="transactions.html">Transactions</a></li>
        <li class="nav-item"><button type="button" id="logoutBtn" class="btn btn-sm btn-outline-light ms-lg-3">Log out</button></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4 py-lg-5">
  <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
    <div>
      <h1 class="h2">Transaction history</h1>
      <p class="text-muted mb-0">Savings account &middot; <span id="acctNo"></span></p>
    </div>
    <div class="btn-group" role="group" aria-label="Filter transactions">
      <button type="button" class="btn btn-outline-secondary active" data-filter="all">All</button>
      <button type="button" class="btn btn-outline-secondary" data-filter="credit">Credits</button>
      <button type="button" class="btn btn-outline-secondary" data-filter="debit">Debits</button>
    </div>
  </header>
  <div class="gb-card p-0 overflow-hidden">
    <div class="table-responsive">
      <table class="table gb-table mb-0" id="txTable">
        <thead><tr><th>Date</th><th>Description</th><th>Type</th><th class="text-end">Amount</th><th class="text-end">Balance</th></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </div>
</main>
<footer class="gb-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>&copy; 2026 Godavari Bank. Demo project, not a real bank. No real money is used.</span>
    <span><a href="dashboard.html">Accounts</a> &nbsp; <a href="transfer.html">Transfer</a> &nbsp; <a href="transactions.html">Transactions</a></span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
